<!DOCTYPE html>
<html lang="id" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>MBG SPPG Voice Gateway</title>
<style>
html,body{margin:0;padding:0;background:transparent}
body{font-family:Arial,sans-serif}
.card{
  width:1px;height:1px;overflow:hidden;
  position:fixed;left:-10000px;top:-10000px;
  opacity:0;pointer-events:none;
}
</style>
</head>
<body translate="no">
<main class="card" aria-hidden="true">
  <div id="status">Menyiapkan microphone...</div>
  <textarea id="transcript"></textarea>
  <button id="startBtn">Mulai Bicara</button>
  <button id="stopBtn" disabled>Berhenti</button>
  <button id="sendBtn">Kirim ke AI</button>
  <button id="clearBtn">Bersihkan</button>
</main>

<script>
(() => {
  const transcriptEl = document.getElementById('transcript');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  let recognition = null;
  let isListening = false;
  let autoMode = true;
  let manuallyStopped = false;
  let autoSendDone = false;
  let finalTranscript = '';
  let lastResultAt = 0;
  let finishTimer = null;

  function status(text) {
    statusEl.textContent = String(text || '');
  }

  function openerOK() {
    return !!(window.opener && !window.opener.closed);
  }

  function closeGatewaySoon() {
    setTimeout(() => {
      try { window.close(); } catch (e) {}
    }, 120);
  }

  function sendToMBG(text) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean || autoSendDone || !openerOK()) return false;

    autoSendDone = true;

    const payload = {
      type: 'MBG_VOICE_TRANSCRIPT',
      source: 'voice',
      text: clean,
      language: 'id-ID',
      createdAt: new Date().toISOString()
    };

    try {
      window.opener.postMessage(payload, '*');
      closeGatewaySoon();
      return true;
    } catch (e) {
      autoSendDone = false;
      return false;
    }
  }

  function finishListeningAndSend() {
    if (autoSendDone) return;

    const text = (finalTranscript || transcriptEl.value || '').replace(/\s+/g, ' ').trim();
    if (!text) return;

    if (recognition && isListening) {
      manuallyStopped = true;
      try { recognition.stop(); } catch (e) {}
    }

    // Kirim langsung jika recognition sudah berhenti; onend juga akan menangani.
    if (!isListening && autoMode) sendToMBG(text);
  }

  function scheduleFinish() {
    clearTimeout(finishTimer);
    // Speech Recognition kadang memecah satu kalimat menjadi beberapa final result.
    // Tunggu sebentar setelah hasil terakhir agar seluruh pertanyaan terkumpul.
    finishTimer = setTimeout(() => {
      if (!isListening || autoSendDone || manuallyStopped) return;
      finishListeningAndSend();
    }, 1200);
  }

  function buildRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;

    const r = new SR();
    r.lang = 'id-ID';
    r.interimResults = true;
    r.continuous = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      isListening = true;
      manuallyStopped = false;
      autoSendDone = false;
      finalTranscript = '';
      transcriptEl.value = '';
      lastResultAt = Date.now();
    };

    r.onresult = (event) => {
      let interim = '';

      for (let i = event.resultIndex || 0; i < event.results.length; i++) {
        const result = event.results[i];
        const text = result && result[0]
          ? String(result[0].transcript || '').trim()
          : '';

        if (!text) continue;

        if (result.isFinal) {
          finalTranscript += (finalTranscript ? ' ' : '') + text;
        } else {
          interim += (interim ? ' ' : '') + text;
        }
      }

      const combined = (finalTranscript + (interim ? ' ' + interim : ''))
        .replace(/\s+/g, ' ')
        .trim();

      if (combined) {
        transcriptEl.value = combined;
        lastResultAt = Date.now();
        scheduleFinish();
      }
    };

    r.onerror = (e) => {
      if (e && e.error === 'no-speech') {
        // Jangan menutup session hanya karena satu no-speech event.
        return;
      }
      if (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed')) {
        status('Izin microphone diperlukan.');
      }
    };

    r.onend = () => {
      isListening = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      clearTimeout(finishTimer);

      const text = (finalTranscript || transcriptEl.value || '')
        .replace(/\s+/g, ' ')
        .trim();

      // Mode normal: satu pertanyaan = satu session.
      // Setelah recognition benar-benar selesai, langsung kirim.
      if (autoMode && !autoSendDone && text) {
        sendToMBG(text);
      }
    };

    return r;
  }

  function startListening(auto) {
    autoMode = auto !== false;
    manuallyStopped = false;
    autoSendDone = false;
    finalTranscript = '';
    transcriptEl.value = '';

    if (!recognition) recognition = buildRecognition();
    if (!recognition) return;

    try {
      recognition.start();
    } catch (e) {}
  }

  startBtn.onclick = () => startListening(false);

  stopBtn.onclick = () => {
    manuallyStopped = true;
    clearTimeout(finishTimer);
    try {
      if (recognition && isListening) recognition.stop();
    } catch (e) {}
  };

  sendBtn.onclick = () => {
    clearTimeout(finishTimer);
    const text = transcriptEl.value.trim();
    if (recognition && isListening) {
      manuallyStopped = true;
      try { recognition.stop(); } catch (e) {}
    }
    sendToMBG(text);
  };

  clearBtn.onclick = () => {
    clearTimeout(finishTimer);
    finalTranscript = '';
    transcriptEl.value = '';
    autoSendDone = false;
  };

  window.addEventListener('message', (event) => {
    if (!event.data || event.data.type !== 'MBG_VOICE_START') return;
    startListening(true);
  });

  recognition = buildRecognition();

  if (openerOK()) {
    setTimeout(() => startListening(true), 250);
  }
})();
</script>
</body>
</html>
