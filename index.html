<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBG SPPG - Voice Gateway V4</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2d3d;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(430px,100%);background:#fff;border:1px solid #dfe6ef;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.08);overflow:hidden}
.head{padding:18px 20px;background:#eef4ff;border-bottom:1px solid #dfe6ef}.head h1{margin:0 0 4px;font-size:21px}.head p{margin:0;color:#607087;font-size:13px}.body{padding:20px}
.status{padding:11px 13px;border-radius:10px;background:#f5f7fa;margin-bottom:14px;font-size:13px;line-height:1.45}.status.ok{background:#eaf8ef}.status.err{background:#fff0f0}
textarea{width:100%;min-height:105px;resize:vertical;border:1px solid #cfd8e5;border-radius:12px;padding:12px;font-size:16px;outline:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:11px 14px;font-size:14px;cursor:pointer}
.primary{background:#23449a;color:white}.secondary{background:#e9eef7;color:#20304a}.danger{background:#fbe7e7;color:#8a2222}.success{background:#2f7d4a;color:white}button:disabled{opacity:.5;cursor:not-allowed}
.note{margin-top:13px;color:#607087;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<header class="head"><h1>🎙️ MBG SPPG — Voice Gateway V4</h1><p>Voice → teks → AI Assistant MBG</p></header>
<section class="body">
<div id="status" class="status">Menyiapkan Voice Gateway...</div>
<textarea id="transcript" placeholder="Hasil suara akan muncul di sini. Anda dapat mengeditnya sebelum dikirim."></textarea>
<div class="actions">
<button id="startBtn" class="primary">🎙 Mulai Bicara</button>
<button id="stopBtn" class="danger" disabled>■ Berhenti</button>
<button id="sendBtn" class="success">➤ Kirim ke AI</button>
<button id="clearBtn" class="secondary">↻ Bersihkan</button>
</div>
<div class="note">Gateway ini di-host pada HTTPS terpisah agar microphone dapat digunakan. Gateway tidak menerima authToken MBG. Setelah dikirim, teks diteruskan ke jendela AI Assistant melalui <code>postMessage</code>.</div>
</section>
</main>
<script>
(() => {
  const transcriptEl = document.getElementById('transcript');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  let recognition = null;
  let isListening = false;
  let autoMode = true;
  let manuallyStopped = false;
  let autoSendDone = false;
  let finalTranscript = '';

  function status(text, type) {
    statusEl.textContent = String(text || '');
    statusEl.className = 'status ' + (type || '');
  }

  function openerOK() {
    return !!(window.opener && !window.opener.closed);
  }

  function sendToMBG(text) {
    const clean = String(text || '').trim();
    if (!clean) {
      status('Tidak ada pertanyaan yang dapat dikirim.', 'err');
      return false;
    }
    if (!openerOK()) {
      status('Jendela AI Assistant MBG tidak ditemukan. Buka voice dari AI Assistant.', 'err');
      return false;
    }
    if (autoSendDone) return true;
    autoSendDone = true;

    const payload = {
      type: 'MBG_VOICE_TRANSCRIPT',
      source: 'voice',
      text: clean,
      language: 'id-ID',
      createdAt: new Date().toISOString()
    };

    try {
      window.opener.postMessage(payload, '*');
      status('Pertanyaan diteruskan ke AI Assistant. Jendela ini akan ditutup.', 'ok');
      sendBtn.disabled = true;
      setTimeout(() => { try { window.close(); } catch (e) {} }, 250);
      return true;
    } catch (e) {
      autoSendDone = false;
      status('Gagal meneruskan pertanyaan ke AI Assistant MBG.', 'err');
      return false;
    }
  }

  function buildRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      status('Browser ini tidak mendukung Speech Recognition. Gunakan Chrome/Edge.', 'err');
      startBtn.disabled = true;
      return null;
    }

    const r = new SR();
    r.lang = 'id-ID';
    r.interimResults = true;
    r.continuous = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      isListening = true;
      manuallyStopped = false;
      autoSendDone = false;
      finalTranscript = '';
      transcriptEl.value = '';
      startBtn.disabled = true;
      stopBtn.disabled = false;
      status('Mendengarkan... silakan ucapkan pertanyaan Anda.', '');
    };

    r.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex || 0; i < event.results.length; i++) {
        const result = event.results[i];
        const text = result && result[0] ? String(result[0].transcript || '') : '';
        if (result.isFinal) finalTranscript += (finalTranscript ? ' ' : '') + text.trim();
        else interim += text;
      }
      const combined = (finalTranscript + (interim ? ' ' + interim : '')).trim();
      if (combined) {
        transcriptEl.value = combined;
        status('Mendengar suara... jangan khawatir, saya menunggu sampai kalimat selesai.', '');
      }
    };

    r.onerror = (e) => {
      const messages = {
        'not-allowed': 'Izin microphone ditolak. Izinkan microphone untuk Voice Gateway.',
        'service-not-allowed': 'Layanan Speech Recognition tidak diizinkan.',
        'no-speech': 'Tidak ada suara yang terdeteksi.',
        'audio-capture': 'Microphone tidak ditemukan atau sedang digunakan aplikasi lain.',
        'network': 'Speech Recognition mengalami masalah jaringan.'
      };
      status(messages[e.error] || ('Speech Recognition error: ' + e.error), 'err');
    };

    r.onend = () => {
      isListening = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      const text = (finalTranscript || transcriptEl.value || '').trim();
      if (autoMode && !manuallyStopped && text && !autoSendDone) {
        status('Transkripsi selesai. Mengirim otomatis ke AI...', 'ok');
        setTimeout(() => sendToMBG(text), 150);
      } else if (manuallyStopped && text && !autoSendDone) {
        status('Transkripsi selesai. Silakan periksa teks atau klik Kirim ke AI.', 'ok');
      }
    };

    return r;
  }

  function startListening(auto) {
    autoMode = auto !== false;
    manuallyStopped = false;
    autoSendDone = false;
    finalTranscript = '';
    if (!recognition) recognition = buildRecognition();
    if (!recognition) return;
    try {
      recognition.start();
    } catch (e) {
      status('Microphone siap. Jika belum mulai otomatis, klik "Mulai Bicara".', 'err');
    }
  }

  startBtn.onclick = () => startListening(false);

  stopBtn.onclick = () => {
    manuallyStopped = true;
    try { if (recognition && isListening) recognition.stop(); } catch (e) {}
  };

  sendBtn.onclick = () => sendToMBG(transcriptEl.value.trim());

  clearBtn.onclick = () => {
    autoSendDone = false;
    finalTranscript = '';
    transcriptEl.value = '';
    status(openerOK() ? 'Siap menerima suara.' : 'Buka gateway dari AI Assistant MBG.', openerOK() ? '' : 'err');
  };

  window.addEventListener('message', (event) => {
    if (!event.data || event.data.type !== 'MBG_VOICE_START') return;
    startListening(true);
  });

  recognition = buildRecognition();

  if (!openerOK()) {
    status('Gateway ini sebaiknya dibuka dari tombol microphone AI Assistant MBG.', 'err');
  } else {
    status('Menyiapkan microphone...', '');
    setTimeout(() => startListening(true), 350);
  }
})();
</script>
</body>
</html>
