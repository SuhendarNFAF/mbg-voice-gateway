<!DOCTYPE html>
<html lang="id" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="google" content="notranslate">
<title>MBG Voice Gateway V7</title>
<style>
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#f7f9fc;
    overflow:hidden;
    font-family:Arial,sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #gateway{
    width:100%;
    max-width:360px;
    min-height:92px;
    box-sizing:border-box;
    padding:18px 20px;
    background:#fff;
    border:1px solid #d9e2ef;
    border-radius:14px;
    box-shadow:0 6px 22px rgba(0,0,0,.12);
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mic{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#294da4;
    color:#fff;
    font-size:17px;
    flex:0 0 auto;
  }
  .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#2f6fed;
    margin-left:2px;
    animation:pulse 1.1s infinite;
    flex:0 0 auto;
  }
  #status{
    font-size:14px;
    font-weight:600;
    color:#1f2d3d;
    line-height:1.3;
  }
  #hint{
    margin-top:5px;
    padding-left:48px;
    color:#64748b;
    font-size:11px;
    line-height:1.35;
  }
  @keyframes pulse{
    0%,100%{opacity:.45;transform:scale(.85)}
    50%{opacity:1;transform:scale(1.15)}
  }
</style>
</head>
<body translate="no">
  <main id="gateway" aria-live="polite">
    <div class="row">
      <span class="mic" aria-hidden="true">🎙️</span>
      <span class="dot" aria-hidden="true"></span>
      <span id="status">Menyiapkan...</span>
    </div>
    <div id="hint">Silakan bicara</div>
  </main>

<script>
(() => {
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');

  let recognition = null;
  let isListening = false;
  let autoSendDone = false;
  let finalTranscript = '';
  let finishTimer = null;
  let restartTimer = null;

  function setStatus(status, hint) {
    statusEl.textContent = status || '';
    hintEl.textContent = hint || '';
  }

  function hasOpener() {
    return !!(window.opener && !window.opener.closed);
  }

  function closeGateway() {
    clearTimeout(restartTimer);
    clearTimeout(finishTimer);
    setTimeout(() => {
      try { window.close(); } catch (e) {}
    }, 100);
  }

  function sendToMBG(text) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean || autoSendDone || !hasOpener()) return false;

    autoSendDone = true;
    try {
      window.opener.postMessage({
        type: 'MBG_VOICE_TRANSCRIPT',
        source: 'voice',
        text: clean,
        language: 'id-ID',
        createdAt: new Date().toISOString()
      }, '*');

      setStatus('Pertanyaan diterima', 'Mengirim ke AI...');
      closeGateway();
      return true;
    } catch (e) {
      autoSendDone = false;
      return false;
    }
  }

  function scheduleStop() {
    clearTimeout(finishTimer);
    finishTimer = setTimeout(() => {
      if (!isListening || autoSendDone) return;
      if (finalTranscript.trim()) {
        try { recognition.stop(); } catch (e) {}
      }
    }, 1100);
  }

  function createRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SR) {
      setStatus('Voice tidak didukung', 'Gunakan Chrome atau Edge');
      return null;
    }

    const r = new SR();
    r.lang = 'id-ID';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      isListening = true;
      finalTranscript = '';
      setStatus('Mendengarkan...', 'Silakan bicara');
    };

    r.onresult = (event) => {
      let interim = '';

      for (let i = event.resultIndex || 0; i < event.results.length; i++) {
        const result = event.results[i];
        if (!result || !result[0]) continue;

        const text = String(result[0].transcript || '').trim();
        if (!text) continue;

        if (result.isFinal) {
          finalTranscript += (finalTranscript ? ' ' : '') + text;
        } else {
          interim += (interim ? ' ' : '') + text;
        }
      }

      const combined = (finalTranscript + (interim ? ' ' + interim : ''))
        .replace(/\s+/g, ' ')
        .trim();

      if (combined) {
        setStatus('Mendengar...', combined);
        scheduleStop();
      }
    };

    r.onerror = (event) => {
      const err = event && event.error;

      if (err === 'no-speech') {
        return;
      }

      if (err === 'not-allowed' || err === 'service-not-allowed') {
        setStatus('Microphone perlu izin', 'Izinkan microphone di browser');
        return;
      }

      setStatus('Voice tidak dapat digunakan', 'Silakan coba lagi');
    };

    r.onend = () => {
      isListening = false;
      clearTimeout(finishTimer);

      const text = finalTranscript.replace(/\s+/g, ' ').trim();

      if (text && !autoSendDone) {
        sendToMBG(text);
        return;
      }

      if (!autoSendDone && hasOpener()) {
        setStatus('Mendengarkan...', 'Silakan bicara');
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          if (!autoSendDone && !isListening) startListening();
        }, 250);
      }
    };

    return r;
  }

  function startListening() {
    if (autoSendDone) return;
    if (!recognition) recognition = createRecognition();
    if (!recognition) return;

    try {
      recognition.start();
    } catch (e) {
      // Browser dapat melempar InvalidStateError jika start dipanggil terlalu cepat.
    }
  }

  // MBG V7 membuka gateway lalu mengirim sinyal mulai.
  window.addEventListener('message', (event) => {
    if (!event.data || event.data.type !== 'MBG_VOICE_START') return;
    startListening();
  });

  if (!hasOpener()) {
    setStatus('Gateway siap', 'Buka melalui tombol microphone MBG');
  } else {
    // Coba mulai otomatis; jika browser menolak tanpa gesture,
    // pesan MBG_VOICE_START tetap menjadi jalur utama.
    setTimeout(startListening, 180);
  }
})();
</script>
</body>
</html>
