<!DOCTYPE html>
<html lang="id" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>MBG Voice Gateway</title>
<style>
html,body{margin:0;padding:0;background:transparent}
body{font-family:Arial,sans-serif}
#gateway{
  width:220px;
  min-height:74px;
  box-sizing:border-box;
  margin:0;
  padding:14px 16px;
  background:#fff;
  border:1px solid #dbe3ef;
  border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.16);
  color:#1f2d3d;
}
.row{display:flex;align-items:center;gap:10px}
.dot{
  width:12px;height:12px;border-radius:50%;
  background:#3157ad;
  flex:0 0 auto;
  animation:pulse 1.2s infinite;
}
#status{font-size:14px;line-height:1.35}
#hint{margin-top:6px;color:#64748b;font-size:11px}
@keyframes pulse{
  0%,100%{transform:scale(.85);opacity:.55}
  50%{transform:scale(1.12);opacity:1}
}
</style>
</head>
<body translate="no">
<div id="gateway" aria-live="polite">
  <div class="row">
    <span class="dot"></span>
    <span id="status">Mendengarkan...</span>
  </div>
  <div id="hint">Silakan bicara</div>
</div>

<script>
(() => {
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');

  let recognition = null;
  let isListening = false;
  let autoSendDone = false;
  let finalTranscript = '';
  let finishTimer = null;
  let lastText = '';

  function setStatus(text, hint) {
    statusEl.textContent = String(text || '');
    hintEl.textContent = String(hint || '');
  }

  function hasOpener() {
    return !!(window.opener && !window.opener.closed);
  }

  function closeGateway() {
    setTimeout(() => {
      try { window.close(); } catch (e) {}
    }, 80);
  }

  function sendToMBG(text) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean || autoSendDone || !hasOpener()) return false;
    if (clean === lastText) return false;

    autoSendDone = true;
    lastText = clean;

    try {
      window.opener.postMessage({
        type:'MBG_VOICE_TRANSCRIPT',
        source:'voice',
        text:clean,
        language:'id-ID',
        createdAt:new Date().toISOString()
      }, '*');

      setStatus('Pertanyaan diterima', 'Mengirim ke AI...');
      closeGateway();
      return true;
    } catch (e) {
      autoSendDone = false;
      return false;
    }
  }

  function scheduleFinish() {
    clearTimeout(finishTimer);
    finishTimer = setTimeout(() => {
      if (!isListening || autoSendDone) return;
      const text = finalTranscript.trim();
      if (!text) return;

      try { recognition.stop(); } catch (e) {}
    }, 1300);
  }

  function createRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setStatus('Browser tidak mendukung voice', 'Gunakan Chrome/Edge');
      return null;
    }

    const r = new SR();
    r.lang = 'id-ID';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      isListening = true;
      autoSendDone = false;
      finalTranscript = '';
      setStatus('Mendengarkan...', 'Silakan bicara');
    };

    r.onresult = (event) => {
      let interim = '';

      for (let i = event.resultIndex || 0; i < event.results.length; i++) {
        const result = event.results[i];
        const text = result && result[0]
          ? String(result[0].transcript || '').trim()
          : '';

        if (!text) continue;

        if (result.isFinal) {
          finalTranscript += (finalTranscript ? ' ' : '') + text;
        } else {
          interim += (interim ? ' ' : '') + text;
        }
      }

      const combined = (finalTranscript + (interim ? ' ' + interim : ''))
        .replace(/\s+/g, ' ')
        .trim();

      if (combined) {
        setStatus('Mendengar...', combined);
        scheduleFinish();
      }
    };

    r.onerror = (event) => {
      const err = event && event.error;

      if (err === 'no-speech') {
        // Beri kesempatan recognition untuk tetap aktif.
        return;
      }

      if (err === 'not-allowed' || err === 'service-not-allowed') {
        setStatus('Microphone perlu izin', 'Izinkan microphone di browser');
        return;
      }

      setStatus('Voice tidak dapat digunakan', 'Silakan coba lagi');
    };

    r.onend = () => {
      isListening = false;
      clearTimeout(finishTimer);

      const text = finalTranscript.replace(/\s+/g, ' ').trim();

      if (text && !autoSendDone) {
        sendToMBG(text);
        return;
      }

      if (!autoSendDone && hasOpener()) {
        setStatus('Menunggu suara...', 'Silakan bicara');
        // Jangan auto-restart terlalu agresif.
        setTimeout(() => {
          if (!autoSendDone && !isListening && hasOpener()) startListening();
        }, 250);
      }
    };

    return r;
  }

  function startListening() {
    if (autoSendDone) return;
    if (!recognition) recognition = createRecognition();
    if (!recognition) return;

    try {
      recognition.start();
    } catch (e) {}
  }

  window.addEventListener('message', (event) => {
    if (!event.data || event.data.type !== 'MBG_VOICE_START') return;
    if (!recognition) recognition = createRecognition();
    startListening();
  });

  if (!hasOpener()) {
    setStatus('Gateway siap', 'Buka dari tombol microphone MBG');
  } else {
    // Dibuka oleh MBG: langsung mencoba mendengar.
    setTimeout(startListening, 180);
  }
})();
</script>
</body>
</html>
